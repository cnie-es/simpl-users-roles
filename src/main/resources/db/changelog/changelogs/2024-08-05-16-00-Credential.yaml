databaseChangeLog:
  - changeSet:
      id: 0
      author: Giovanni Frison
      changes:
        - createTable:
            tableName: credential
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: content
                  type: bytea
                  constraints:
                    nullable: false