databaseChangeLog:
  - changeSet:
      id: 0
      author: Matteo Blasi
      changes:
        - createTable:
            tableName: role
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(70)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(250)
              - column:
                  name: builtin
                  type: BOOLEAN
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: creation_timestamp
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_update_timestamp
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: role
            columnNames: code
            constraintName: uk_role_code

        - addUniqueConstraint:
            tableName: role
            columnNames: name
            constraintName: uk_role_name

  - changeSet:
      id: 1
      author: Matteo Blasi
      changes:
        - customChange:
            class: eu.europa.ec.simpl.usersroles.liquidbase.migration_2026_01_30.SchemaMigration