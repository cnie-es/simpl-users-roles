databaseChangeLog:
  - changeSet:
      id: 0
      author: Matteo Blasi
      changes:
        - createTable:
            tableName: role_request
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: user_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    checkConstraint: 'user_email ~* ''^[a-zA-Z0-9_+&*-]+(?:\.[a-zA-Z0-9_+&*-]+){0,255}@(?:[a-zA-Z0-9-]+\.){1,255}[a-zA-Z]{2,7}$'''
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: creation_timestamp
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: last_update_timestamp
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: reviewed_by
                  type: VARCHAR(100)

        - createTable:
            tableName: role_requested
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: role_request_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: requested_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: approved
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: requested_timestamp
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: role_requested
            baseColumnNames: role_request_id
            referencedTableName: role_request
            referencedColumnNames: id
            constraintName: fk_role_requested_role_request
